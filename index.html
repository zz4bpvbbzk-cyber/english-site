<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小英語字母樂園</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>🍎 國小英語字母樂園</h1>
    <p id="subtitle"></p>
  </header>
  <main>
    <section class="module-grid" id="moduleGrid"></section>
  </main>
  <footer id="footer"></footer>
  <script src="lessons.js"></script>
  <script>
    document.getElementById('subtitle').textContent = SITE.subtitle;
    document.getElementById('footer').textContent = SITE.footer;
    const grid = document.getElementById('moduleGrid');
    MODULES.forEach(function (m) {
      const card = document.createElement('a');
      card.className = 'module-card';
      card.href = 'module.html?m=' + m.id;
      card.style.setProperty('--c', m.color);
      card.innerHTML =
        '<div class="module-emoji">' + m.emoji + '</div>' +
        '<h2>' + m.grade + '　' + m.semester + '</h2>' +
        '<h3>' + m.title + '</h3>' +
        '<p>' + m.description + '</p>' +
        '<span class="lesson-count">共 ' + m.lessons.length + ' 節</span>';
      grid.appendChild(card);
    });
  </script>
</body>
</html>
